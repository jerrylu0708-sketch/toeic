*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"PingFang TC","Noto Sans TC",sans-serif;display:flex;flex-direction:column;overflow:hidden}
main{flex:1;overflow-y:auto;padding:20px 18px 12px;max-width:560px;width:100%;margin:0 auto}
nav{display:flex;border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;padding:12px 0 10px;font-size:14px;color:var(--mute);font-family:inherit}
nav button.on{color:var(--ink);font-weight:700;box-shadow:inset 0 3px 0 var(--hi)}
.top{display:flex;justify-content:space-between;color:var(--mute);font-size:14px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;min-height:340px;padding:26px 22px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer}
.en{font:700 40px/1.15 Georgia,"Times New Roman",serif;margin:0 0 6px;word-break:break-word}
.pos{color:var(--mute);font-style:italic;font-family:Georgia,serif}
.zh{font-size:30px;font-weight:700;margin:6px 0 16px}
.ex{font-family:Georgia,serif;font-size:17px;margin:0;text-align:left;border-left:3px solid var(--hi);padding-left:12px}
.exz{color:var(--mute);font-size:14px;margin:4px 0 0;text-align:left;padding-left:15px}
.hint{color:var(--mute);font-size:14px;margin-top:22px}
.row{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:700;font-family:inherit;background:var(--acc);color:var(--onacc)}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.sm{flex:none;padding:8px 16px;font-size:15px;margin-top:10px;align-self:center}
h2{font-size:22px;margin:4px 0 14px}
.q{font:700 34px/1.2 Georgia,serif;text-align:center;margin:18px 0 6px}
.opt{display:block;width:100%;text-align:left;margin-top:10px;padding:15px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;font-family:inherit}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.stat b{display:block;font:700 34px/1.1 Georgia,serif}
.stat span{color:var(--mute);font-size:14px}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:var(--hi)}
.boxes{display:flex;gap:6px;margin-top:8px}
.boxes div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 0;text-align:center;font-size:13px;color:var(--mute)}
.boxes b{display:block;font-size:20px;color:var(--ink)}
.link{background:none;border:0;color:var(--mute);text-decoration:underline;font-size:14px;margin-top:22px;font-family:inherit}
</style>
</head>

R.trim().split("\n").forEach(l=>{const a=l.split("|");W.push([a[0],a[1],a[2],"",""])});
const DAYS=[0,0,1,3,7,14];
let mem={};
const ld=()=>{try{return JSON.parse(localStorage.getItem('toeic1'))||mem}catch(e){return mem}};
const sv=()=>{mem=S;try{localStorage.setItem('toeic1',JSON.stringify(S))}catch(e){}};
let S=ld();S.b=S.b||{};S.nx=S.nx||{};S.log=S.log||{};S.streak=S.streak||0;S.last=S.last||0;
const dn=()=>{const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*6e4)/864e5)};
const $=s=>document.querySelector(s);
let cn=0,wait={};
let tab='card',cur=null,flip=false,prev=-1,q=null,qs=null;

function mark(id,ok){
  const t=dn();
  S.b[id]=ok?(S.b[id]===undefined?2:Math.min(5,S.b[id]+1)):1;
  cn++;if(ok)delete wait[id];else wait[id]=cn+5+Math.floor(Math.random()*4);
  S.nx[id]=t+(ok?DAYS[S.b[id]]:0);
  S.log[t]=(S.log[t]||0)+1;
  if(S.last!==t){S.streak=(S.last===t-1)?S.streak+1:1;S.last=t}
  sv();
}
function pick(){
  const t=dn(),all=W.map((_,i)=>i).filter(i=>i!==prev);
  const ids=all.filter(i=>!(wait[i]>cn));
  const due=ids.filter(i=>S.b[i]!==undefined&&S.nx[i]<=t);
  if(due.length)return due[Math.floor(Math.random()*due.length)];
  const nw=ids.filter(i=>S.b[i]===undefined);
  if(nw.length)return nw[0];
  if(ids.length){ids.sort((a,b)=>S.b[a]-S.b[b]);return ids[0]}
  all.sort((a,b)=>(wait[a]||0)-(wait[b]||0));return all[0];
}
function say(i){
  try{const u=new SpeechSynthesisUtterance(W[i][0]);u.lang='en-US';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}
}
function card(){
  if(cur===null)cur=pick();
  const w=W[cur],t=dn(),n=Object.keys(S.b).length;
  const due=W.filter((_,i)=>S.b[i]!==undefined&&S.nx[i]<=t).length;
  $('#app').innerHTML=`<div class="top"><span>今天已學 ${S.log[t]||0} 次</span><span>待複習 ${due}・新字 ${W.length-n}</span></div>
  <div class="card" id="c">${flip?
   `<div class="en">${w[0]}</div><div class="pos">${w[1]}</div><div class="zh">${w[2]}</div>${w[3]?`<p class="ex">${w[3]}</p><p class="exz">${w[4]}</p>`:''}`:
   `<div class="en">${w[0]}</div><div class="pos">${w[1]}</div><div class="hint">點一下看意思</div>`}
   <button class="btn alt sm" id="sp">發音</button></div>
  ${flip?`<div class="row"><button class="btn alt" id="no">不熟</button><button class="btn" id="yes">會了</button></div>`:`<div class="row"><button class="btn" id="show">顯示答案</button></div>`}`;
  $('#c').onclick=e=>{if(e.target.id==='sp'){say(cur);return}flip=true;card()};
  if($('#show'))$('#show').onclick=()=>{flip=true;card()};
  if($('#yes'))$('#yes').onclick=()=>next(true);
  if($('#no'))$('#no').onclick=()=>next(false);
}
function next(ok){mark(cur,ok);prev=cur;cur=pick();flip=false;card()}

function newQ(){
  const id=Math.floor(Math.random()*W.length),opts=[id];
  while(opts.length<4){const r=Math.floor(Math.random()*W.length);if(!opts.includes(r)&&!opts.some(o=>W[o][2]===W[r][2]))opts.push(r)}
  opts.sort(()=>Math.random()-.5);return{id,opts,done:false};
}
function quiz(){
  if(!qs)qs={n:0,ok:0};
  if(!q)q=newQ();
  const w=W[q.id];
  $('#app').innerHTML=`<div class="top"><span>已答 ${qs.n} 題</span><span>答對 ${qs.ok} 題</span></div>
  <div class="q">${w[0]}</div><div style="text-align:center"><span class="pos">${w[1]}</span> <button class="btn alt sm" id="sp" style="margin:0 0 0 8px">發音</button></div>
  ${q.opts.map(o=>`<button class="opt" data-o="${o}">${W[o][2]}</button>`).join('')}
  ${q.done?`${w[3]?`<p class="ex" style="margin-top:16px">${w[3]}</p><p class="exz">${w[4]}</p>`:''}<div class="row"><button class="btn" id="nx">下一題</button></div>`:''}`;
  $('#sp').onclick=()=>say(q.id);
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(q.done)return;q.done=true;const o=+b.dataset.o,ok=o===q.id;
    qs.n++;if(ok)qs.ok++;mark(q.id,ok);quiz();
    document.querySelectorAll('.opt').forEach(x=>{const v=+x.dataset.o;if(v===q.id)x.classList.add('ok');else if(v===o)x.classList.add('bad')});
    say(q.id);
  });
  if($('#nx'))$('#nx').onclick=()=>{q=newQ();quiz()};
}
function stat(){
  const t=dn(),ids=W.map((_,i)=>i);
  const c=[0,1,2,3,4,5].map(k=>ids.filter(i=>(S.b[i]||0)===k).length);
  const mas=c[4]+c[5],learned=W.length-c[0],pct=Math.round(mas/W.length*100);
  const sk=(S.last===t||S.last===t-1)?S.streak:0;
  $('#app').innerHTML=`<h2>學習進度</h2>
  <div class="stats"><div class="stat"><b>${mas}</b><span>已熟練（共 ${W.length} 字）</span></div><div class="stat"><b>${sk}</b><span>連續學習天數</span></div>
  <div class="stat"><b>${learned}</b><span>已看過</span></div><div class="stat"><b>${S.log[t]||0}</b><span>今天練習次數</span></div></div>
  <p style="margin:18px 0 0">熟練度 ${pct}%</p><div class="bar"><i style="width:${pct}%"></i></div>
  <div class="boxes"><div>未學<b>${c[0]}</b></div><div>盒1<b>${c[1]}</b></div><div>盒2<b>${c[2]}</b></div><div>盒3<b>${c[3]}</b></div><div>盒4<b>${c[4]}</b></div><div>盒5<b>${c[5]}</b></div></div>
  <p class="hint">按「會了」或答對會升一盒，間隔拉長；不熟或答錯會退回盒1，馬上再出現。盒4以上算熟練。</p>
  <button class="link" id="rs">清除所有紀錄</button><p class="hint" style="margin-top:8px">版本 v3</p>`;
  $('#rs').onclick=()=>{if(confirm('確定要清除所有學習紀錄？')){S={b:{},nx:{},log:{},streak:0,last:0};sv();cur=null;stat()}};
}
function go(t){
  tab=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  ({card,quiz,stat})[t]();
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.t));
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
go('card');
</script>
